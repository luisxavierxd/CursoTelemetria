<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 200" width="100%" role="img" aria-labelledby="tp-title">
  <title id="tp-title">Pipeline de telemetría de MadRams: ESP32 transmite por LoRa 915MHz a un receptor en pits, que guarda en InfluxDB y muestra en Grafana; en paralelo el ESP32 graba un respaldo en la tarjeta SD.</title>
  <rect width="470" height="200" fill="#131B2E"/>
  <defs>
    <marker id="tp-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#6C8CFF"/>
    </marker>
  </defs>

  <!-- fila principal -->
  <g font-family="monospace" font-size="10">
    <rect x="15" y="70" width="70" height="40" rx="6" fill="none" stroke="#E8ECF6" stroke-width="2"/>
    <text x="50" y="88" text-anchor="middle" fill="#E8ECF6">ESP32</text>
    <text x="50" y="101" text-anchor="middle" fill="#8A93AC" font-size="8">en el coche</text>

    <rect x="125" y="70" width="70" height="40" rx="6" fill="none" stroke="#FFB13D" stroke-width="2"/>
    <text x="160" y="88" text-anchor="middle" fill="#FFB13D">LoRa</text>
    <text x="160" y="101" text-anchor="middle" fill="#8A93AC" font-size="8">915 MHz</text>

    <rect x="235" y="70" width="70" height="40" rx="6" fill="none" stroke="#E8ECF6" stroke-width="2"/>
    <text x="270" y="88" text-anchor="middle" fill="#E8ECF6">Receptor</text>
    <text x="270" y="101" text-anchor="middle" fill="#8A93AC" font-size="8">en pits</text>

    <rect x="345" y="70" width="60" height="40" rx="6" fill="none" stroke="#2547E0" stroke-width="2"/>
    <text x="375" y="88" text-anchor="middle" fill="#6C8CFF">InfluxDB</text>

    <rect x="345" y="18" width="60" height="34" rx="6" fill="none" stroke="#2547E0" stroke-width="2"/>
    <text x="375" y="39" text-anchor="middle" fill="#6C8CFF">Grafana</text>
  </g>

  <!-- flechas fila principal -->
  <line x1="85" y1="90" x2="123" y2="90" stroke="#6C8CFF" stroke-width="2" marker-end="url(#tp-arrow)"/>
  <line x1="195" y1="90" x2="233" y2="90" stroke="#6C8CFF" stroke-width="2" marker-end="url(#tp-arrow)"/>
  <line x1="305" y1="90" x2="343" y2="90" stroke="#6C8CFF" stroke-width="2" marker-end="url(#tp-arrow)"/>
  <line x1="375" y1="70" x2="375" y2="54" stroke="#6C8CFF" stroke-width="2" marker-end="url(#tp-arrow)"/>

  <!-- respaldo SD -->
  <line x1="50" y1="110" x2="50" y2="150" stroke="#6C8CFF" stroke-width="2" marker-end="url(#tp-arrow)"/>
  <rect x="15" y="150" width="70" height="36" rx="6" fill="none" stroke="#FFB13D" stroke-width="2"/>
  <text x="50" y="168" text-anchor="middle" fill="#FFB13D" font-family="monospace" font-size="10">SD</text>
  <text x="50" y="180" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="8">respaldo CSV</text>
  <text x="150" y="170" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="9">SD @10Hz (denso) · LoRa @2Hz (en vivo)</text>
</svg>
