<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="100%" role="img" aria-labelledby="ax-title">
  <title id="ax-title">Ejes de un acelerómetro (X, Y, Z) que salen del chip IMU, y el vector de gravedad apuntando hacia abajo, que en reposo marca aproximadamente 9.8 m/s².</title>
  <rect width="320" height="210" fill="#131B2E"/>
  <defs>
    <marker id="ax-a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#6C8CFF"/></marker>
    <marker id="ax-g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#FFB13D"/></marker>
  </defs>

  <!-- ejes desde el centro del chip (150,112) -->
  <line x1="150" y1="112" x2="258" y2="112" stroke="#6C8CFF" stroke-width="2" marker-end="url(#ax-a)"/>
  <text x="266" y="116" fill="#6C8CFF" font-family="monospace" font-size="12">X</text>
  <line x1="150" y1="112" x2="150" y2="34" stroke="#6C8CFF" stroke-width="2" marker-end="url(#ax-a)"/>
  <text x="150" y="28" text-anchor="middle" fill="#6C8CFF" font-family="monospace" font-size="12">Y</text>
  <line x1="150" y1="112" x2="86" y2="166" stroke="#6C8CFF" stroke-width="2" marker-end="url(#ax-a)"/>
  <text x="72" y="174" fill="#6C8CFF" font-family="monospace" font-size="12">Z</text>

  <!-- chip IMU (pequeño, en el origen) con su etiqueta debajo y despejada -->
  <rect x="142" y="104" width="16" height="16" rx="2" fill="#1B2740" stroke="#E8ECF6" stroke-width="1.5"/>
  <text x="150" y="150" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="10">IMU</text>

  <!-- gravedad -->
  <line x1="212" y1="58" x2="212" y2="150" stroke="#FFB13D" stroke-width="2.5" marker-end="url(#ax-g)"/>
  <text x="222" y="106" fill="#FFB13D" font-family="monospace" font-size="12">g</text>
  <text x="212" y="176" text-anchor="middle" fill="#FFB13D" font-family="monospace" font-size="10">en reposo ≈ 9.8 m/s²</text>
</svg>
