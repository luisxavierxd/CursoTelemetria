<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190" width="100%" role="img" aria-labelledby="sp-title">
  <title id="sp-title">Circuito en serie: dos resistencias una tras otra en un mismo lazo. Circuito en paralelo: dos resistencias en ramas separadas entre los mismos dos nodos.</title>
  <rect width="380" height="190" fill="#131B2E"/>

  <!-- Serie -->
  <text x="95" y="24" text-anchor="middle" fill="#E8ECF6" font-family="monospace" font-size="13">Serie</text>
  <rect x="30" y="50" width="130" height="100" fill="none" stroke="#6C8CFF" stroke-width="2"/>
  <rect x="60" y="40" width="30" height="20" fill="#131B2E" stroke="#2547E0" stroke-width="2"/>
  <text x="75" y="34" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="10">R1</text>
  <rect x="100" y="40" width="30" height="20" fill="#131B2E" stroke="#2547E0" stroke-width="2"/>
  <text x="115" y="34" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="10">R2</text>
  <text x="20" y="105" text-anchor="middle" fill="#FFB13D" font-family="monospace" font-size="11">+</text>
  <text x="95" y="168" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="9">misma corriente por ambas</text>

  <!-- Paralelo -->
  <text x="285" y="24" text-anchor="middle" fill="#E8ECF6" font-family="monospace" font-size="13">Paralelo</text>
  <line x1="230" y1="60" x2="340" y2="60" stroke="#6C8CFF" stroke-width="2"/>
  <line x1="230" y1="140" x2="340" y2="140" stroke="#6C8CFF" stroke-width="2"/>
  <rect x="250" y="80" width="20" height="40" fill="#131B2E" stroke="#2547E0" stroke-width="2"/>
  <text x="260" y="105" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="10">R1</text>
  <rect x="300" y="80" width="20" height="40" fill="#131B2E" stroke="#2547E0" stroke-width="2"/>
  <text x="310" y="105" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="10">R2</text>
  <line x1="260" y1="60" x2="260" y2="80" stroke="#6C8CFF" stroke-width="2"/>
  <line x1="260" y1="120" x2="260" y2="140" stroke="#6C8CFF" stroke-width="2"/>
  <line x1="310" y1="60" x2="310" y2="80" stroke="#6C8CFF" stroke-width="2"/>
  <line x1="310" y1="120" x2="310" y2="140" stroke="#6C8CFF" stroke-width="2"/>
  <text x="285" y="168" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="9">mismo voltaje en ambas</text>
</svg>
