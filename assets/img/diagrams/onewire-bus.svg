<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="100%" role="img" aria-labelledby="ow-title">
  <title id="ow-title">Bus OneWire: un pin DATA del Arduino con resistencia pull-up de 4.7kΩ a VCC, compartido por dos sensores DS18B20 (motor y CVT).</title>
  <rect width="420" height="210" fill="#131B2E"/>

  <rect x="20" y="80" width="80" height="50" rx="6" fill="none" stroke="#E8ECF6" stroke-width="2"/>
  <text x="60" y="102" text-anchor="middle" fill="#E8ECF6" font-family="monospace" font-size="11">Arduino</text>
  <text x="60" y="118" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="9">pin DATA</text>

  <!-- linea de datos unica -->
  <line x1="100" y1="105" x2="380" y2="105" stroke="#2547E0" stroke-width="2"/>
  <text x="200" y="98" text-anchor="middle" fill="#2547E0" font-family="monospace" font-size="10">un solo cable de DATOS (OneWire)</text>

  <!-- pull-up 4.7k a VCC -->
  <line x1="150" y1="105" x2="150" y2="55" stroke="#8A93AC" stroke-width="2"/>
  <rect x="140" y="35" width="20" height="20" fill="#131B2E" stroke="#FFB13D" stroke-width="2"/>
  <text x="185" y="42" text-anchor="middle" fill="#FFB13D" font-family="monospace" font-size="9">4.7kΩ</text>
  <text x="185" y="53" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="9">pull-up</text>
  <line x1="150" y1="35" x2="150" y2="22" stroke="#8A93AC" stroke-width="2"/>
  <text x="150" y="16" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="9">VCC</text>

  <!-- sensor 1 -->
  <line x1="270" y1="105" x2="270" y2="150" stroke="#2547E0" stroke-width="2"/>
  <rect x="220" y="150" width="100" height="40" rx="6" fill="none" stroke="#FFB13D" stroke-width="2"/>
  <text x="270" y="168" text-anchor="middle" fill="#FFB13D" font-family="monospace" font-size="10">DS18B20 · Motor</text>
  <text x="270" y="182" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="8">ROM única</text>

  <!-- sensor 2 -->
  <line x1="350" y1="105" x2="350" y2="150" stroke="#2547E0" stroke-width="2"/>
  <rect x="330" y="150" width="80" height="40" rx="6" fill="none" stroke="#FFB13D" stroke-width="2"/>
  <text x="370" y="168" text-anchor="middle" fill="#FFB13D" font-family="monospace" font-size="10">DS18B20</text>
  <text x="370" y="182" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="8">CVT · ROM única</text>
</svg>
