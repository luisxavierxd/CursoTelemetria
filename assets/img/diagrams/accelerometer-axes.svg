<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="100%" role="img" aria-labelledby="ax-title">
  <title id="ax-title">Ejes de un acelerómetro (X, Y, Z) y el vector de gravedad apuntando hacia abajo, que en reposo marca aproximadamente 9.8 m/s².</title>
  <rect width="320" height="210" fill="#131B2E"/>
  <defs>
    <marker id="ax-a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#6C8CFF"/></marker>
    <marker id="ax-g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#FFB13D"/></marker>
  </defs>

  <!-- cuerpo del IMU -->
  <rect x="120" y="90" width="46" height="34" rx="4" fill="#1B2740" stroke="#E8ECF6" stroke-width="1.5"/>
  <text x="143" y="111" text-anchor="middle" fill="#8A93AC" font-family="monospace" font-size="9">IMU</text>

  <!-- ejes -->
  <line x1="143" y1="107" x2="250" y2="107" stroke="#6C8CFF" stroke-width="2" marker-end="url(#ax-a)"/>
  <text x="258" y="111" fill="#6C8CFF" font-family="monospace" font-size="12">X</text>
  <line x1="143" y1="107" x2="143" y2="30" stroke="#6C8CFF" stroke-width="2" marker-end="url(#ax-a)"/>
  <text x="138" y="26" text-anchor="middle" fill="#6C8CFF" font-family="monospace" font-size="12">Y</text>
  <line x1="143" y1="107" x2="80" y2="160" stroke="#6C8CFF" stroke-width="2" marker-end="url(#ax-a)"/>
  <text x="66" y="168" fill="#6C8CFF" font-family="monospace" font-size="12">Z</text>

  <!-- gravedad -->
  <line x1="200" y1="60" x2="200" y2="150" stroke="#FFB13D" stroke-width="2.5" marker-end="url(#ax-g)"/>
  <text x="210" y="105" fill="#FFB13D" font-family="monospace" font-size="11">g</text>
  <text x="200" y="176" text-anchor="middle" fill="#FFB13D" font-family="monospace" font-size="10">en reposo ≈ 9.8 m/s²</text>
</svg>
